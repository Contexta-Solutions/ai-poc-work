# Ground truth probe lists.
#
# NOT a full span annotation. Each entry is a literal string that must (or must
# not) survive into the redacted output, checked case-insensitively.
#
#   must_redact  every one of these is PHI. Surviving = a LEAK. Drives recall.
#   must_keep    every one of these is clinical content. Missing = OVER-REDACTION.
#
# EVERY ENTRY MUST ACTUALLY OCCUR IN ITS DOCUMENT. `evaluate.py` validates this
# and refuses to score otherwise, because a phantom probe corrupts the metrics in
# both directions: a must_keep that isn't there reads as permanent over-redaction,
# and a must_redact that isn't there can never leak, inflating recall for free.
# Both happened on the first draft of this file.
#
# ALL SEVEN PDFs ARE THE SAME PATIENT (NAGA LAXMI J, UMR2162620), so shared PHI
# lives in `common`. The lab reports additionally share a footer block.
#
# TRIAGE JUDGEMENT CALLS, stated so they can be argued with:
#   * facility names and addresses -> must_redact. Azure's own PhiCategory list
#     includes Hospital, and we already treat "Banjara Hills" as PHI, so
#     "Tenet Diagnostics" and "Rainbow Children" are treated the same for
#     consistency. If you decide the lab's own name is not PHI, move them.
#   * GST no., service codes, public URL -> must_keep. These identify the
#     BUSINESS, not the patient, and appear on every report the lab issues.
#   * form labels (Can.amt, Bill Cum Receipt) -> must_keep. Not identifiers;
#     redacting them destroys structure a summariser reads.
#   * staff usernames (sadf, arunkumara) -> must_redact under HIPAA #18.

